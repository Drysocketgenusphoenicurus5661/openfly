[project]
name = "openfly"
version = "0.1.0"
description = "A fruit fly connectome (MaleCNS v1.0) trading an intraday NIFTY straddle through OpenAlgo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<2.5",
  "numba>=0.61",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pillow>=10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "websockets>=12",
  "openalgo>=2.0.3",
  "python-dotenv>=1.0",
  "filelock>=3.15",
  "tzdata>=2024.1",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
openfly = "openfly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openfly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
